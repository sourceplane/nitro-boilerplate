# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (NI → NI-1, NI-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: nitro-boilerplate
  key: NI
spec:
  title: "Vercel's Nitro starter on Cloudflare Workers"
  summary: "Vercel's Nitro starter — a Nitro server whose one file-based route answers with the template's welcome page — runs as one Cloudflare Worker built by Nitro's own cloudflare_module preset, beside a health route, inside the Cirrus baseline's repository conventions, and becomes an Orun baseline that takes a new Nitro server from nothing to live on stage and prod in one landing."
  state: started
  milestones:
    - name: "NI0 — the spec"
      exitCriteria:
        - "the repository is born with its intent, CI, tooling and spec index, and this doc set and the task contracts are on main"
      tasks: [NI-1]
    - name: "NI1 — Nitro on Workers"
      exitCriteria:
        - "apps/api is the upstream Nitro app (srcDir server, its one route), built by the cloudflare_module preset into the Worker and its Static Assets that the committed wrangler.jsonc names, with a /health route and one name seam"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green, the tests building the app with Nitro and calling every route over HTTP on Node"
        - "`wrangler dev` over the build answers the welcome page, /health for its environment and Nitro's 404"
        - "the README says how to run, test and deploy it, and how every Vercel piece maps to Cloudflare"
      tasks: [NI-2]
    - name: "NI2 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card) and repo-blueprint.yaml (the build) take a new Nitro server from nothing to live on stage and prod in one landing, then record it"
        - "an app built from it carries the app only, renamed throughout to its own name, repository and Worker, with the example's licence intact"
        - "Baseline CI is green: contract tests, generated component docs, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the end-to-end tier — the stage lane's steps in a staged job tree, the Worker smoke-tested and every route read"
      tasks: [NI-3]
