apiVersion: orun.io/v1
kind: TaskContract
metadata:
  name: NI-2
  title: "Nitro on Workers"
spec:
  goal: Vercel's Nitro starter runs as one Cloudflare Worker — the template's Nitro app built by Nitro's own cloudflare_module preset into the Worker and its Static Assets — with its tests, and its README saying how it maps to Vercel
  affects:
    - apps/api
    - tests/api
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - README.md
  doneWhen:
    - pnpm typecheck, lint, test and build are green
    - wrangler dev over the build answers the welcome page, /health and Nitro's 404
  gates: []
